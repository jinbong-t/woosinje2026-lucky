<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우신제 행운권 추첨</title>
<script>
(function(){var h=location.hash,list=['lucky-v3.html','lucky2026.html','woosinje.html'];
function tryAt(i){if(i>=list.length-1){location.replace(list[list.length-1]+h);return;}
fetch(list[i],{method:'HEAD',cache:'no-store'}).then(function(r){if(r.ok)location.replace(list[i]+h);else tryAt(i+1);}).catch(function(){tryAt(i+1);});}
tryAt(0);})();
</script>
</head><body style="background:#67C2EA;font-family:sans-serif"><p>행운권 추첨을 여는 중…</p></body></html>
